  return /^TEDCC/.test(x.code)?["cc","วิชาชีพครู"]:["cv","วิชาวิศวกรรมโยธา"]}
let state={v:"year",k:"1"};
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^(year|teacher|room)=(.+)$/);if(m&&DATA.views[m[1]]&&DATA.views[m[1]][m[2]]!==undefined){state={v:m[1],k:m[2]};return true}return false}
function save(){try{localStorage.setItem("tt-last",JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem("tt-last")||"null");if(s&&DATA.views[s.v]&&DATA.views[s.v][s.k]!==undefined)state=s}catch(e){}}
const who=x=>(x.teachers||[]).map(t=>"อ."+t).join(", ");
function tags(x){let b="";if(x.elective)b+='<span class="tag">วิชาเลือก</span>';return b}
function metaOf(x){const p=[];if(x.ours&&x.kind)p.push(x.kind);if(x.other&&x.kind)p.push(x.kind);if(x.room&&state.v!=="room")p.push(x.room);
  if(x.groups&&x.groups.length)p.push("แบ่งกลุ่ม "+x.groups.join(" / "));else if(state.v!=="teacher"&&x.teachers&&x.teachers.length)p.push(who(x));
  if(state.v==="room"&&x.years&&x.years.length)p.push("ปี "+x.years.join(","));return p.join("  ·  ")}
function nameOf(x){return x.booking?"":esc(x.name)}
function itemsFor(){let L=(DATA.views[state.v][state.k]||[]).map(x=>({...x}));
  if(state.v!=="room")L.push({d:DATA.activity.d,s:DATA.activity.s,e:DATA.activity.e,code:"กิจกรรม",name:"ชั่วโมงกิจกรรม",act:true});
  return L.sort((a,b)=>a.d-b.d||a.s-b.s)}
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===state.v));
  const ch=document.getElementById("chips");ch.innerHTML=keysOf(state.v).map(k=>`<button class="chip" aria-pressed="${k===state.k}" data-k="${esc(k)}">${esc(chipOf(state.v,k))}</button>`).join("");
  ch.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.k=b.dataset.k;go()});
  const cur=ch.querySelector('[aria-pressed="true"]');if(cur)cur.scrollIntoView({inline:"center",block:"nearest"});
  const head=state.v==="year"?"ตารางเรียนนักศึกษา":state.v==="teacher"?"ตารางสอนอาจารย์":"ตารางห้องเรียน";
  document.getElementById("h1").innerHTML=head+"<br>ภาคเรียนที่ "+esc(DATA.term);
  const title=state.v==="year"?"ค.อ.บ.ยธ. ชั้นปีที่ "+state.k:state.v==="teacher"?(T[state.k]||state.k):"ห้อง "+state.k;
  const L=itemsFor(), ours=L.filter(x=>!x.act&&!x.other&&!x.booking&&!x.general);
  const sumH=L.filter(x=>!x.act&&!x.booking&&(state.v!=="teacher"||!x.other)).reduce((a,x)=>a+(x.e-x.s)/2,0);
  document.getElementById("title").innerHTML=esc(title)+(L.length>1?`<span class="sum">${state.v==="teacher"?"สอน ค.อ.บ.ยธ. ":"รวม "}${state.v==="teacher"?ours.reduce((a,x)=>a+(x.e-x.s)/2,0):sumH} ชม. ต่อสัปดาห์</span>`:"");
  document.title=head+" "+title+" · "+DATA.term;
  const used=new Set(L.map(x=>cat(x)[0]));
  const LEG=[["cc","วิชาชีพครู","var(--pink)"],["cv","วิชาวิศวกรรมโยธา","var(--peach)"],["ge","วิชาศึกษาทั่วไป","var(--lav)"],["act","กิจกรรม","var(--mint)"],["oth","หลักสูตร/สาขาอื่น","var(--grey)"]];
  document.getElementById("legend").innerHTML=LEG.filter(l=>used.has(l[0])).map(([k,t,c])=>`<span><i style="--x:${c}"></i>${t}</span>`).join("");
  const list=document.getElementById("list"),grid=document.getElementById("grid");
  if(state.v==="year"&&DATA.notes[state.k]){list.innerHTML=grid.innerHTML=`<div class="note">${esc(DATA.notes[state.k])}</div>`;return}
  const maxDay=Math.max(4,...L.map(x=>x.d)), END=Math.max(20,...L.map(x=>x.e));
  // mobile list
  let h="";
  for(let d=0;d<=maxDay;d++){const D=L.filter(x=>x.d===d);if(d>4&&!D.length)continue;
    const dh=D.filter(x=>!x.act).reduce((a,x)=>a+(x.e-x.s)/2,0);
    h+=`<div class="panel"><div class="dayh">${DAYS[d]}<small>${D.length?(dh?dh+" ชม.":""):"ไม่มีคาบ"}</small></div>`;
    for(const x of D){const[k,lab]=cat(x);
      let ticks="";for(let i=2;i<END;i+=2)ticks+=`<s style="left:${i/END*100}%"></s>`;
      h+=`<div class="card c-${k}"><div class="row1"><div class="cat"><span class="ic">${icon(k)}</span>${lab}</div><span class="dur">${hrs(x)}</span></div>
        <div class="time">${tm(x.s)} – ${tm(x.e)}</div>
        <div class="ttl"><b>${esc(x.code)}</b> ${nameOf(x)}${tags(x)}</div>
        ${metaOf(x)?`<div class="meta">${esc(metaOf(x))}</div>`:""}
        <div class="tl" aria-hidden="true">${ticks}<i style="left:${x.s/END*100}%;width:${(x.e-x.s)/END*100}%"></i></div><div class="tll"><span style="left:0">8:00</span><span style="left:${8/END*100}%">12:00</span><span style="left:${10/END*100}%;transform:translateX(0);padding-left:4px">13:00</span><span style="left:100%">${tm(END)}</span></div></div>`}
    h+="</div>"}
  list.innerHTML=h;
  // desktop grid: every 30 min = 1 equal column, every day = 1 equal-height row
  let g=`<div class="g" style="--n:${END}"><div class="gh"><div></div>`;for(let i=0;i<END;i++)g+=`<div>${i%2===0?tm(i):""}</div>`;g+="</div>";
  for(let d=0;d<=maxDay;d++){const D=L.filter(x=>x.d===d);if(d>4&&!D.length)continue;
    const lanes=[];for(const x of D){let k=lanes.findIndex(e=>e<=x.s);if(k<0){k=lanes.length;lanes.push(0)}lanes[k]=x.e;x._l=k}
    const nl=Math.max(1,lanes.length);
    g+=`<div class="gr ${nl>1?"lanes2":""}" style="--lanes:${nl}"><div class="dn">${DAYS[d]}</div>`;
    for(let i=0;i<END;i+=2)g+=`<div class="gl" style="grid-column:${i+2}"></div>`;
    for(const x of D){const[k]=cat(x);const m=metaOf(x);
      g+=`<div class="blk c-${k}" style="grid-column:${x.s+2}/${x.e+2};grid-row:${x._l+1}" title="${esc(x.code+" "+(x.name||"")+" "+tm(x.s)+"–"+tm(x.e)+(m?" · "+m:""))}"><div class="bt"><span>${esc(x.code)}</span><span>${hrs(x)}</span></div><div class="bn">${nameOf(x)}</div><div class="meta">${tm(x.s)}–${tm(x.e)}${m?"  ·  "+esc(m):""}</div></div>`}
    g+="</div>"}
  grid.innerHTML=g+"</div>";
}
function go(){history.replaceState(null,"","#"+encodeURIComponent(state.v+"="+state.k));save();render()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.v=b.dataset.v;state.k=keysOf(state.v)[0];go()});
function setView(g){document.body.classList.toggle("forcegrid",g);const b=document.getElementById("viewbtn");b.setAttribute("aria-pressed",g);b.querySelector("span").textContent=g?"ดูแบบการ์ด":"ดูแบบตาราง";try{localStorage.setItem("tt-grid",g?"1":"0")}catch(e){}}
document.getElementById("viewbtn").onclick=()=>setView(!document.body.classList.contains("forcegrid"));
try{if(localStorage.getItem("tt-grid")==="1")setView(true)}catch(e){}
document.getElementById("share").onclick=async()=>{const url=location.href;const t=document.title;
  try{if(navigator.share){await navigator.share({title:t,url});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);toast("คัดลอกลิงก์แล้ว")}catch(e){prompt("คัดลอกลิงก์นี้",url)}};
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
document.getElementById("upd").innerHTML="อัปเดต<br>"+esc(DATA.updated);
const dlIcon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
document.getElementById("dl").innerHTML=(DATA.files&&DATA.files.length)?"<h3>ดาวน์โหลดไฟล์ทางการ</h3><div class='files'>"+DATA.files.map(f=>`<a href="${encodeURI(f.href)}" download><span class="ic">${dlIcon}</span>${esc(f.label.replace(/\s*\.xlsx$/,""))}</a>`).join("")+"</div>":"";
document.getElementById("foot").innerHTML="ข้อมูลตรงกับระบบทะเบียน ณ "+esc(DATA.updated)+" หากไม่ตรงกัน ให้ยึดระบบทะเบียน reg.rmutl.ac.th<br>สาขาครุศาสตร์อุตสาหกรรมและเทคโนโลยี หลักสูตรครุศาสตร์อุตสาหกรรมบัณฑิต สาขาวิชาวิศวกรรมโยธา<br>คณะวิศวกรรมศาสตร์ มหาวิทยาลัยเทคโนโลยีราชมงคลล้านนา";
window.addEventListener("hashchange",()=>{if(fromHash())render()});
if(!fromHash())load();go();
</script>
</body>
</html>
